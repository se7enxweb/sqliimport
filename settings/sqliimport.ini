#?ini charset="utf-8"?
# DO NOT EDIT THIS FILE !
# Use an override instead

[ImportSettings]
# Default parent node ID for imported content
# Used as a fallback setting if no such setting has been defined for source handler
DefaultParentNodeID=2

# View caching is disabled by default for performance reasons
# It's disabled only for the import script
# ViewCache is cleared once import has been done, via sqliimport_cleanup cronjob
ViewCaching=disabled

# Same as for ViewCaching above
# Import will be much faster with ObjectIndexing set to disabled
# Will just activate site.ini SearchSettings.DelayedIndexing for current import script
# Content objects will be indexed once import has been done, via sqliimport_cleanup cronjob
ObjectIndexing=disabled

# List of available source handlers
# Each declared source handler must have a dedicated INI section
# Each handler has to be identified by a unique identifier (without space or special chars)
AvailableSourceHandlers[]
#AvailableSourceHandlers[]=myhandler

# User ID of the XML Import Robot
# If none provided, site.ini [UserSettings]/AnonymousUserID will be used
RobotUserID=

# Max time to wait for each Stream (in seconds)
StreamTimeout=50

# INI Section for source handler
# Each declared source handler must have such a dedicated INI section
# Section name must be [<handler_identifier>-HandlerSettings]
##[myhandler-HandlerSettings]
## Indicates if handler is enabled or not. Mandatory. Must be "true" or "false"
##Enabled=true
## Intelligible name
##Name=My Handler
## Class for source handler. Must implement ISQLIImportSourceHandler and extend SQLIImportAbstractSourceHandler
##ClassName=MySourceHandler
## Facultative. Indicates whether debug is enabled or not  
##Debug=enabled
## Same as [ImportSettings]/DefaultParentNodeID, but source handler specific
##DefaultParentNodeID=2
## StreamTimeout, handler specific. If empty, will take [ImportSettings]/StreamTimeout
#StreamTimeout=
## Below you can add your own settings for your source handler

[ContentSettings]
# Diff handlers are used to check if a content field really needs to be updated or not.
# If a content object is strictly the same, then it shouldn't be published (avoids useless time consumption).
# By default, datatype toString() method is used to compare input content with current content, 
# but it can be insufficient with complex datatypes (ie. for images, binary files...).
# By defining a diff handler, you extend the SQLIImport content system allowing 
# it to check for content modification more accurately.
# Key is the datatype string, value is the class to use (must implement ISQLIDiffHandler
DiffHandlerMap[ezimage]=SQLIImageDiffHandler
DiffHandlerMap[ezbinaryfile]=SQLIBinaryFileDiffHandler

# Default diff handler that will be used if datatype is not mapped to a handler in DiffHandlerMap
# Note : It is HIGHLY RECOMMENDED for all datatypes to implement toString() methods (see eZDatatype::toString())
#        Attribute content will be indeed compared with toString() method or data_text field !
DefaultDiffHandler=SQLIDefaultDiffHandler

# Datatypes for which you want to skip content modification
ContentModificationSkipDatatypes[]
#ContentModificationSkipDatatypes[]=ezstring

# ---- 7x SQLI Import 2.x ---------------------------------------------------------------------------------------------
# The 2.x engine (imports made in the admin, the job queue, the run log). Override in an override or siteaccess
# directory; never edit this file on a site.

[SourceSettings]
# The formats of the catalogue are kernel services tagged sqliimport.source (kernelservices.ini of the extension:
# one source class plus one block each). A block [Source_<id>] here sets the Status= of one: enabled, example (shown
# but not offered for a new import) or disabled.
# Sources[] with a [Source_<id>] Class= block is the way of 2.0.0-alpha.1 and still works.
Sources[]
# The directories on the server a source may read a file from (origin "path"). Empty: none, only uploads and URLs.
AllowedPaths[]
#AllowedPaths[]=var/import
# The largest upload or download of a source, in megabytes
MaxSourceMegabytes=200
# enabled: a URL source may point to a private or reserved network (an intranet export). disabled (the default):
# such addresses are refused, so an import cannot be used to read internal services.
AllowPrivateHosts=disabled

[CrawlSettings]
# The formats sitemap and webpage, which read public web pages themselves. They obey robots.txt (Allow, Disallow and
# Crawl-delay for the user agent below or "*"), send no cookies or credentials, run no JavaScript and read every page
# with the checks and limits of [SourceSettings] (private networks, MaxSourceMegabytes) and [ImportSettings]
# StreamTimeout. The terms of the site read apply; read only public pages you may use.
# The most pages one run reads, whatever an import asks for
MaxPages=2000
# The shortest pause between two requests to a site, in seconds (an import may ask for a longer one; a Crawl-delay
# of robots.txt that is longer wins)
MinDelay=0.5
# The User-Agent header, also the name robots.txt rules are matched against. Empty: "7x SQLI Import (Exponential;
# +<the site's SiteURL>)", so a site's owner can see who reads and reach you
UserAgent=

[PlatformSettings]
# The sources that read a site's API themselves (Drupal JSON:API, another Exponential site's REST API, Airtable,
# Notion; MaxPages also limits the requests of Airtable and Notion). Their
# addresses are checked like a URL source (AllowPrivateHosts above), answers to another host are never followed with
# the credentials, and passwords and tokens are names of secrets ([SecretSettings]).
# The most requests (pages) one run makes to a site
MaxPages=200
# The most nodes one run reads from another Exponential site (the import's own "Most nodes" can only be lower)
MaxItems=5000
# The largest single answer of a site, in megabytes
MaxResponseMegabytes=20

[Source_spreadsheet]
# XLSX and ODS files, read without a library (needs the PHP extension zip)
Status=enabled

[HandlerSettings]
# The 2.x handlers besides "mapping" (the no-code handler, always there). Each has a block [Handler_<id>] with
# Class= (implementing expImportHandlerInterface) and Status=. The 1.x handlers of [ImportSettings]
# AvailableSourceHandlers[] are listed too, marked legacy.
Handlers[]

[RunSettings]
# Records per chunk (one job of the job queue each); an import can set its own
ChunkSize=200
# Records a dry run reads
DryRunRows=20
# The lowest severity kept in a run's log: debug, info, notice, warning, error
LogLevel=info
# Ended runs older than this many days are removed with their rows, log and files by the cron part (0 = never)
KeepDays=90
# Days a run can be undone (its created objects to the trash, its updates back to the version before); an import can
# set its own (Processing step). The cron part marks older runs as no longer undoable. 0: no undo.
UndoDays=30

[AdminSettings]
# Rows per page of the lists
ListLimit=25
# The address of the administration, for the links in notification mails (e.g. https://edit.example.org/admin);
# empty: the mails give the path of the run page
AdminURL=

[SecretSettings]
# The secrets sources need (database and mailbox passwords, API keys), by name. An import stores only the name; set
# the values in the site's own settings (settings/override/sqliimport.ini.append.php), never in a repository:
#   Secrets[crm_db]=...
# A source option may also name an environment variable of the PHP process: env:CRM_DB_PASSWORD.
Secrets[]

[SqlSourceSettings]
# The SQL source (sql) reads the rows of a single SELECT over a read-only connection; its password is the name of a
# secret above. A database server in a private or reserved network (an intranet database) is refused like an address
# (see [SourceSettings] AllowPrivateHosts) unless it is listed here, by the name or address the import gives:
#   AllowedHosts[]=db.intranet.example.org
#   AllowedHosts[]=10.0.0.12
AllowedHosts[]
# An SQLite file must lie inside one of [SourceSettings] AllowedPaths[].
# enabled: an import may read this site's own database (read-only, over a connection of its own). Its tables hold user
# accounts and password hashes, so leave it disabled unless the people who edit imports may see all of it.
SiteDatabase=disabled
# The time limit of the query in seconds, set on the server where it has one (MySQL MAX_EXECUTION_TIME, MariaDB
# max_statement_time, PostgreSQL statement_timeout, the call timeout of oci8, the query timeout of pdo_sqlsrv and
# pdo_dblib, SQL Server's SET LOCK_TIMEOUT); reading the rows stops after ten times as long.
QueryTimeout=60
# Oracle (oracle): the driver. auto: oci8 when this PHP has it, else pdo_oci; or oci8, pdo_oci. The PHP of the job
# queue's workers reads the runs: it needs the driver (oci8 and the Oracle Instant Client), the web server's PHP only
# for the editor's test and sample.
OracleDriver=auto
# Oracle TNS names an import may give as its database (resolved by tnsnames.ora of this server, so they name hosts
# an administrator chose). Host, port and service name, or //host:port/service, need no entry here.
#   AllowedTnsNames[]=PRODDB
AllowedTnsNames[]
# Microsoft SQL Server (sqlsrv): the PDO driver. auto: pdo_sqlsrv, else pdo_dblib (FreeTDS), else PDO_ODBC with an ODBC
# driver for SQL Server; or sqlsrv, dblib, odbc. SQL Server has no read-only session: the connection asks for
# ApplicationIntent=ReadOnly and the query check refuses everything but a SELECT, so give the import a database user
# with SELECT rights only (the role db_datareader).
SqlServerDriver=auto
# PDO_ODBC: the ODBC driver as odbcinst.ini names it. Empty: ODBC Driver 18 for SQL Server, or a FreeTDS driver when
# only that one is installed.
#   OdbcDriver=ODBC Driver 18 for SQL Server
#   OdbcDriver=FreeTDS
OdbcDriver=
# PDO_ODBC: the character set the ODBC driver gives text in, when it is not UTF-8 (the Microsoft driver uses the
# locale of the PHP process); text that is not UTF-8 is converted from it. Empty: no conversion.
#   OdbcCharset=Windows-1252
OdbcCharset=
# pdo_sqlsrv and the Microsoft ODBC driver: encrypt the connection (enabled, the default of ODBC Driver 18), and
# whether to trust the server's certificate without checking it (disabled; enable only for a test server with a
# self-signed certificate).
SqlServerEncrypt=enabled
SqlServerTrustServerCertificate=disabled

[ImapSourceSettings]
# The IMAP source (imap) opens the mailbox read-only unless an import asks to mark its messages as seen; its password
# is the name of a secret above. A mail server in a private or reserved network is refused unless it is listed here:
#   AllowedHosts[]=mail.intranet.example.org
AllowedHosts[]
# The time limit of connecting and of each answer of the server, in seconds
Timeout=30
# A larger message is read with its headers only (and marked "truncated")
MaxMessageMegabytes=10

[MongoDbSourceSettings]
# The MongoDB source (mongodb) only runs a find (filter, projection, sort) and never a command, an aggregation or a
# write; filters with $where, $function, $accumulator, $out or $merge are refused. Its password is the name of a secret
# above, never part of the URI. A server in a private or reserved network is refused unless it is listed here (each
# host of the URI; for mongodb+srv:// the SRV name or the hosts it names):
#   AllowedHosts[]=mongo.intranet.example.org
#   AllowedHosts[]=10.0.0.21
AllowedHosts[]
# The time limit in seconds: connecting and choosing a server (at most 60), each query on the server (maxTimeMS) and
# the socket (twice as long)
Timeout=30
# The most documents one page may ask for, whatever an import's "Documents per page" says
MaxBatchSize=10000

[RedisSourceSettings]
# The Redis source (redis) walks the keys with SCAN and sends only TYPE, TTL, HGETALL, GET, LRANGE, SMEMBERS,
# ZRANGE WITHSCORES and XRANGE (after AUTH and SELECT); its password is the name of a secret above. A server in a
# private or reserved network is refused unless it is listed here:
#   AllowedHosts[]=redis.intranet.example.org
AllowedHosts[]
# auto: the PHP extension redis where it is installed, else the built-in client over a socket; or phpredis, socket
Client=auto
# The time limit of connecting and of each answer, in seconds
Timeout=30
# A larger value stops the run (the built-in client; phpredis reads what the server sends)
MaxValueMegabytes=16
# A run stops when more keys than this match the pattern (narrow the pattern instead)
MaxScannedKeys=10000000
# Test connection: the most steps of SCAN it takes to find a first matching key
TestScanRounds=50

[SearchSourceSettings]
# The Elasticsearch and OpenSearch source (elasticsearch) only searches (GET /, <index>/_search and the point in time
# or scroll requests that page it); scripts in a query are refused. Its password, API key or token is the name of a
# secret above. A server in a private or reserved network is refused like an address (see [SourceSettings]
# AllowPrivateHosts) unless it is listed here, by the name or address the import gives:
#   AllowedHosts[]=search.intranet.example.org
#   AllowedHosts[]=10.0.0.20
AllowedHosts[]
# The most pages (searches) one run reads; the size of a page is the import's own (at most 10000 documents)
MaxPages=1000

[DuckDbSourceSettings]
# The DuckDB source (duckdb) runs a single SELECT over Parquet, CSV or JSON files or a DuckDB database file; every
# file must lie inside [SourceSettings] AllowedPaths[].
# The driver. auto: the duckdb program when there is one, else PHP FFI with libduckdb; or cli, ffi.
Driver=auto
# The duckdb program: a name looked up in the PATH (and /usr/local/bin, /opt/duckdb) or a full path
Binary=duckdb
# FFI: the file of libduckdb. Empty: /usr/local/lib/libduckdb.so, /usr/lib64/libduckdb.so and the other usual places
Library=
# enabled: the session may reach only the files of the import (allowed_paths and enable_external_access=false; needs
# DuckDB 1.3 or later). disabled for an older DuckDB: then only the check of the query keeps it to those files.
Sandbox=enabled
# enabled: an import may also read http, https and s3 addresses (the httpfs extension of DuckDB must be installed;
# hosts in a private network only when listed in AllowedHosts[])
AllowRemoteFiles=disabled
AllowedHosts[]
# The time limit of one query (one page) in seconds (the duckdb program is stopped after it; not with FFI)
QueryTimeout=60
# The largest output of one page in megabytes
MaxOutputMegabytes=100
# The most files a pattern may give
MaxFiles=1000

[LdapSourceSettings]
# The LDAP source (ldap) binds and searches only, over ldaps:// or StartTLS (the certificate is checked against the CA
# certificates of the system's OpenLDAP client, ldap.conf TLS_CACERT); its password is the name of a secret above. A
# directory server in a private or reserved network (the usual intranet directory, and localhost) is refused unless
# it is listed here, by the name or address the import gives:
#   AllowedHosts[]=ldap.intranet.example.org
#   AllowedHosts[]=localhost
AllowedHosts[]
# The time limit of connecting and of each search, in seconds
Timeout=30

[DynamoDbSourceSettings]
# The Amazon DynamoDB source (dynamodb) sends only Scan and Query (and DescribeTable for Test connection), signed with
# AWS Signature Version 4; its secret access key and session token are names of secrets above. The default endpoint
# is https://dynamodb.<region>.amazonaws.com; a custom endpoint (DynamoDB Local, a compatible service) in a private or
# reserved network is refused unless it is listed here:
#   AllowedHosts[]=localhost
AllowedHosts[]
# The most requests (pages) one run makes
MaxPages=1000

[GoogleCloudSourceSettings]
# The Firestore (firestore), BigQuery (bigquery) and Firebase Realtime Database (firebase_rtdb) sources sign in with a
# service account whose JSON key is the value of a secret above (Firebase also with a legacy database secret).
# The most requests (pages) one run makes
MaxPages=1000
# BigQuery: the most bytes one query may bill when the import gives no limit of its own; a query that would scan more
# fails instead of costing more. 0: no limit (not recommended). Default 1 GiB.
MaximumBytesBilled=1073741824
# Firebase: a database that is not https://<name>.firebaseio.com or https://<name>.<region>.firebasedatabase.app (the
# emulator) only when its host is listed here:
#   AllowedHosts[]=localhost
AllowedHosts[]

[CassandraSourceSettings]
# The Cassandra/ScyllaDB source (cassandra) runs a single CQL SELECT; its password is the name of a secret above. A
# contact point in a private or reserved network is refused unless it is listed here, by the name or address the
# import gives:
#   AllowedHosts[]=cassandra.intranet.example.org
AllowedHosts[]
# auto: the PHP extension cassandra (DataStax) where it is installed, else the built-in client of the native protocol
# v4 over a socket; or extension, socket
Client=auto
# The time limit of connecting and of each answer, in seconds
Timeout=30
# A larger answer (one frame of the built-in client) stops the run
MaxFrameMegabytes=64
# The most pages one run reads
MaxPages=10000

[HandoverSettings]
# Tools that hand a file to Imports (sqliimport/edit/new/(from)/<tool>/(job)/<id>) besides xrowextract and bccie:
#   Tools[]=<tool id>;<class with a static fileOf( $jobID, eZUser $user )>
Tools[]
